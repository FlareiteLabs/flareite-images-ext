[package]
name = "images"
description = "Images for Flareite: a viewer that shows image files as pictures."
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The editor's repository, checked out beside this one.
flareite-extension-api = { path = "../editor/crates/flareite-extension-api" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
