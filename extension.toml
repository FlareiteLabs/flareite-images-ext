# Images: a viewer for image files. Opening a PNG, JPEG, GIF, WebP, BMP, ICO,
# or AVIF file shows the picture, on a background and at a size the toolbar
# chooses, with its format, size in pixels, and file size. SVG files open as
# text, and in the viewer with Reopen Editor With. See docs/extensions.md#webviews.
id = "example.images"
name = "Images"
version = "0.1.0"
description = "Shows image files as pictures you can zoom, on the background you choose."
author = "Ferrite"
icon = "icon.svg"
api_version = "1"
entrypoint = "../target/wasm32-unknown-unknown/release/images.wasm"

[engines]
ferrite = ">=0.1.0"

# Run when a viewer's page asks for its picture's details.
[[commands]]
id = "example.images.details"
title = "Image Details"
hidden = true

# The page loads the picture itself, so the viewers need no command.
[[viewers]]
id = "image"
title = "Image Viewer"
patterns = ["*.png", "*.apng", "*.{jpg,jpeg,jpe,jfif}", "*.gif", "*.webp", "*.bmp", "*.ico", "*.avif"]
webview = "media/viewer.html"
on_message = "example.images.details"

# SVG is text people edit, so the viewer is only an option for it.
[[viewers]]
id = "svg"
title = "Image Viewer"
patterns = ["*.svg"]
webview = "media/viewer.html"
on_message = "example.images.details"
priority = "option"
