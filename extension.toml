# Images: a viewer for image files. Opening a PNG, JPEG, GIF, WebP, BMP, ICO,
# or AVIF file shows the picture, on a background and at a size the toolbar
# chooses, with its format, size in pixels, and file size. SVG files open as
# text, and in the viewer with Reopen Editor With. See Flareite's docs/extensions.md#webviews.
id = "flareite.images"
name = "Images"
version = "1.0.0"
description = "Shows image files as pictures you can zoom, on the background you choose."
author = "Flareite"
icon = "icon.svg"
api_version = "2"
entrypoint = "target/wasm32-unknown-unknown/release/images.wasm"

[engines]
flareite = ">=0.1.0"

[build]
command = "cargo"
args = ["build", "--release"]
watch = ["src", "Cargo.toml"]

# The page loads the picture itself, and asks for its details with a
# message (a `webview-message` event).
[[viewers]]
id = "image"
title = "Image Viewer"
patterns = [
  "*.png",
  "*.apng",
  "*.{jpg,jpeg,jpe,jfif}",
  "*.gif",
  "*.webp",
  "*.bmp",
  "*.ico",
  "*.avif",
]
webview = "media/viewer.html"

# SVG is text people edit, so the viewer is only an option for it.
[[viewers]]
id = "svg"
title = "Image Viewer"
patterns = ["*.svg"]
webview = "media/viewer.html"
priority = "option"
